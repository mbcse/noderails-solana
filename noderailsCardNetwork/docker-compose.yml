# WallCard backend Docker: **`backend`** (Express API + signer-host + BullMQ worker) reads **`DATABASE_URL`**,
# **`REDIS_URL`**, and other secrets from repo-root **`.env`** — Postgres / Redis are hosted separately (RDS, etc.).
#
# **`caddy`** starts with **`backend`**: TLS on **:443** and HTTP on **:80**, reverse-proxy to **`backend:9080`** (see **`docker/caddy/Caddyfile`**).
# Set **`API_DOMAIN`** in `.env` for your public hostname (Let’s Encrypt). Set **`TRUST_PROXY=true`** in `.env` for correct client IP behind Caddy.
# **`backend`** still publishes **:9080** on the host as **`API_PUBLISH_PORT`** (optional direct access / health checks).
#
# Start: **`docker compose up -d --build`** or **`pnpm docker:api:up`**. Stop: **`docker compose down`**

services:
  backend:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      # Small EC2 builders (exit 137 ≈ OOM): add swap, or uncomment and tweak build args.
      # args:
      #   BUILD_NODE_HEAP_MB: "1024"
      #   PNPM_CHILD_CONCURRENCY: "1"
      #   TURBO_CONCURRENCY: "1"
    image: wallcard-backend:local
    restart: unless-stopped
    ports:
      - "${API_PUBLISH_PORT:-9080}:9080"
    env_file:
      - .env
    environment:
      LISTEN_HOST: "0.0.0.0"
      PORT: "9080"
      SIGNER_HOST_URL: "http://127.0.0.1:8081"
      SIGNER_HOST_PORT: "8081"
      # CORS: set on API host (.env): EXPO_WEB_ORIGIN / WALLET_APP_ORIGIN (+ optional CORS_ALLOWED_ORIGINS)
      # NODE_HEAP_MB_API: "256"
      # NODE_HEAP_MB_SIGNER: "96"
      # NODE_HEAP_MB_WORKER: "96"
      # PRISMA_MIGRATE_DEPLOY: "true"
    networks:
      - wallcard
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wallcard

volumes:
  caddy_data:
  caddy_config:

networks:
  wallcard:
    driver: bridge
